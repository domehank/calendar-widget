name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked
          cp target/release/calendar-widget.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: calendar-widget
          path: calendar-widget.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" calendar-widget.exe --title "$GITHUB_REF_NAME" --generate-notes
